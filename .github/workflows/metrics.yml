name: Metrics

# Renders the language breakdown as a labelled percentage bar. Runs in
# Actions with a PAT, so private repos count and there is no dependency on
# a rate-limited public instance.

on:
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  languages:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: lowlighter/metrics@latest
        with:
          filename: metrics.languages.svg
          token: ${{ secrets.PROFILE_CARDS_TOKEN }}
          user: abdulah-x
          # empty base: render only the languages panel, no header/activity
          base: ""
          config_timezone: Asia/Karachi
          config_padding: 6%
          # metrics has no dark theme input; restyle to match the tokyonight cards
          extras_css: |
            .items-wrapper {
              background: #1a1b27;
              border: 1px solid #30374b;
              border-radius: 6px;
              padding: 10px 14px;
            }
            svg { color: #a9b1d6 !important; }
            h2, h3 { color: #7aa2f7 !important; font-weight: 600; }
            .field svg { fill: #7aa2f7 !important; }
          plugin_languages: yes
          plugin_languages_details: percentage
          plugin_languages_limit: 8
          plugin_languages_sections: most-used
          # GitHub's own palette puts Python (#3572A5) and TypeScript (#3178c6)
          # on near-identical blues; use distinct tokyonight hues instead
          plugin_languages_colors: >-
            typescript:#7aa2f7,
            python:#e0af68,
            plpgsql:#bb9af7,
            html:#f7768e,
            javascript:#9ece6a,
            dockerfile:#7dcfff,
            css:#ff9e64,
            shell:#ad8ee6
